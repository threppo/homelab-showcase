services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped

    ports:
      - "3552:3552"

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Warsaw

      APP_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}

      PROJECTS_DIRECTORY: /opt/example-stacks

      # Optional; I would personally disable telemetry.
      ANALYTICS_DISABLED: "true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/example-app-data/arcane:/app/data
      - /opt/example-stacks:/opt/example-stacks

    # Helps Arcane identify/update its own container.
    cgroup: host

    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
